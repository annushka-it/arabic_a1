<style>
@font-face{
  font-family:"Naskh";
  src:url("fonts/naskh.woff2") format("woff2");
  font-weight:400 700;font-display:swap;
}
</style>
<style>
:root{
  --ink:#241B36;
  --paper:#EFEAF2;
  --surface:#FFFFFF;
  --muted:#6E6482;
  --line:#DCD4E4;
  --gold:#B07A1E;
  --know:#2F7D6E;
  --again:#A84055;
  --shadow:rgba(36,27,54,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F0EBF6;--paper:#171023;--surface:#231A33;--muted:#A79BBC;--line:#3A2E4D;
    --gold:#E0B45C;--know:#5FBFA9;--again:#E07A8C;--shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ink:#F0EBF6;--paper:#171023;--surface:#231A33;--muted:#A79BBC;--line:#3A2E4D;
  --gold:#E0B45C;--know:#5FBFA9;--again:#E07A8C;--shadow:rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:400;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
.ar{font-family:"Naskh","Noto Naskh Arabic","Geeza Pro",serif;direction:rtl}
header{
  display:flex;align-items:center;gap:14px;padding:14px 18px;
  border-bottom:1px solid var(--line);
  position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5;
}
.brand{font-size:.82rem;letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.brand b{color:var(--ink);font-weight:600}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s ease}
.iconbtn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:7px 11px;font:inherit;font-size:.85rem;cursor:pointer;
}
.iconbtn:hover{border-color:var(--gold)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 18px 0;width:100%;max-width:640px;margin:0 auto}
.card{
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 10px 30px var(--shadow);padding:38px 26px;text-align:center;
  min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  cursor:pointer;
}
.cat{font-size:.74rem;color:var(--muted);letter-spacing:.04em}
.prompt{font-size:1.6rem;line-height:1.35;font-weight:300;max-width:26ch}
.answer{display:none;width:100%;border-top:1px solid var(--line);padding-top:20px;margin-top:2px}
.card.open .answer{display:block}
.card.open .hint{display:none}
.arabic{font-size:3.1rem;line-height:1.75;font-weight:600;color:var(--ink);word-break:keep-all}
.en{font-size:.92rem;color:var(--muted);margin-top:6px}
.hint{font-size:.8rem;color:var(--muted)}
.actions{display:flex;gap:12px;width:100%;max-width:640px;margin:16px auto 0;padding:0 18px}
.btn{
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:56px;
  flex:1;padding:15px 10px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:1rem;cursor:pointer;
}
.btn:hover{transform:translateY(-1px)}
.btn.again{border-color:var(--again);color:var(--again)}
.btn.know{border-color:var(--know);color:var(--know)}
.btn.wide{background:var(--ink);color:var(--paper);border-color:var(--ink)}
footer{padding:14px 18px 22px;text-align:center;color:var(--muted);font-size:.78rem}
footer a{color:inherit}
.counts{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:.78rem;color:var(--muted)}
.sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;
  align-items:flex-end;justify-content:center;
}
.sheet.on{display:flex}
.panel{
  background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;
  padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto;
}
.panel h2{margin:0 0 4px;font-size:1.05rem;font-weight:600}
.panel p{margin:0 0 16px;color:var(--muted);font-size:.84rem}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px}
label.chip{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;
  padding:9px 11px;font-size:.86rem;cursor:pointer;
}
label.chip:has(input:checked){border-color:var(--gold);color:var(--gold)}
label.chip input{accent-color:var(--gold)}
label.chip span.n{margin-left:auto;color:var(--muted);font-size:.76rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.seg{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.85rem;cursor:pointer;background:var(--surface);color:var(--ink);font:inherit}
.seg.on{border-color:var(--gold);color:var(--gold)}
.lbl{font-size:.78rem;color:var(--muted);width:100%;margin-bottom:-6px}
.done{text-align:center}
.done .big{font-size:2rem;font-weight:300;margin-bottom:8px}
.danger{color:var(--again);border-color:var(--again)}
@media (max-width:420px){.prompt{font-size:1.35rem}.arabic{font-size:2.5rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Арабский A1</b> <span id="sessionInfo"></span></div>
  <div class="bar"><i id="barFill"></i></div>
  <button class="iconbtn" id="openSettings">Колода</button>
</header>

<main>
  <div id="stage"></div>
</main>
<div id="actionsWrap"></div>
<footer>Список слов: Arabic Vocabulary Profile A1 (Familiar, Atanassova, Soliman, 2025) · 414 единиц</footer>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2>Колода</h2>
    <p>Выбери категории и размер подхода. Прогресс сохраняется в этом браузере.</p>
    <div class="cats" id="cats"></div>
    <div class="row">
      <div class="lbl">Слов в подходе</div>
      <button class="seg" data-size="10">10</button>
      <button class="seg" data-size="20">20</button>
      <button class="seg" data-size="40">40</button>
      <button class="seg" data-size="0">все</button>
    </div>
    <div class="row">
      <div class="lbl">Направление</div>
      <button class="seg" data-dir="ru">рус → араб</button>
      <button class="seg" data-dir="ar">араб → рус</button>
    </div>
    <div class="row">
      <div class="lbl">Повторение</div>
      <button class="seg" data-mode="srs">интервальное</button>
      <button class="seg" data-mode="all">все подряд</button>
    </div>
    <div class="row">
      <button class="btn wide" id="startBtn">Начать подход</button>
    </div>
    <div class="row">
      <button class="seg danger" id="resetBtn">Сбросить прогресс</button>
      <button class="seg" id="themeBtn">Тема</button>
    </div>
  </div>
</div>

const KEY = 'avp-a1-v1';
const CATS = [...new Set(CARDS.map(c => c.c))];

let state = {prog:{}, sel:CATS.slice(), size:20, dir:'ru', mode:'srs', session:0, theme:null};
try{
  const raw = localStorage.getItem(KEY);
  if(raw) state = Object.assign(state, JSON.parse(raw));
}catch(e){}
if(state.theme) document.documentElement.setAttribute('data-theme', state.theme);

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

// --- deck building -------------------------------------------------
let queue = [], current = null, round = {n:0, total:0, know:0};

function dueCards(){
  return CARDS.filter(c => {
    if(!state.sel.includes(c.c)) return false;
    if(state.mode === 'all') return true;
    const p = state.prog[c.id];
    if(!p) return true;
    return p.due <= state.session;
  });
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startRound(){
  state.session++;
  let pool = shuffle(dueCards());
  if(state.mode === 'srs') pool.sort((a,b)=>((state.prog[a.id]?.box)||0)-((state.prog[b.id]?.box)||0));
  if(state.size > 0) pool = pool.slice(0, state.size);
  queue = pool;
  round = {n:0, total:queue.length, know:0};
  save();
  next();
}

function next(){
  current = queue.shift() || null;
  render();
}

function grade(known){
  if(!current) return;
  const p = state.prog[current.id] || {box:0, due:0, seen:0, ok:0};
  p.seen++;
  if(known){ p.box = Math.min(5, p.box + 1); p.ok++; round.know++; }
  else { p.box = 1; }
  p.due = state.session + [0,1,2,4,8,16][p.box];
  state.prog[current.id] = p;
  round.n++;
  save();
  next();
}

const sessionInfo = document.getElementById('sessionInfo');

function stats(){
  const sel = CARDS.filter(c=>state.sel.includes(c.c));
  const learned = sel.filter(c=>(state.prog[c.id]?.box||0)>=4).length;
  return {total:sel.length, learned, due:dueCards().length};
}

function render(){
  const s = stats();
  sessionInfo.textContent = `· выучено ${s.learned} из ${s.total}`;
  barFill.style.width = round.total ? (round.n/round.total*100)+'%' : '0%';

  if(current){
    const front = state.dir === 'ru' ? current.r : current.a;
    const back  = state.dir === 'ru' ? current.a : current.r;
    stage.innerHTML = `
      <div class="card" id="card" tabindex="0" role="button" aria-label="Показать ответ">
        <div class="cat">${current.c} · ${round.n+1} / ${round.total}</div>
        <div class="prompt ${state.dir==='ru'?'':'ar arabic'}">${esc(front)}</div>
        <div class="hint">нажми, чтобы увидеть ответ · пробел</div>
        <div class="answer">
          <div class="${state.dir==='ru'?'ar arabic':'prompt'}">${esc(back)}</div>
          <div class="en">${esc(current.e)}</div>
        </div>
      </div>`;
    actions.innerHTML = `
      <div class="actions">
        <button class="btn again" id="againBtn">Не помню</button>
        <button class="btn know" id="knowBtn">Знаю</button>
      </div>`;
    document.getElementById('card').onclick = reveal;
    document.getElementById('againBtn').onclick = ()=>grade(false);
    document.getElementById('knowBtn').onclick = ()=>grade(true);
  } else {
    const d = s.due;
    stage.innerHTML = `
      <div class="card done" style="cursor:default">
        <div>
          <div class="big">${round.total ? `${round.know} из ${round.total}` : 'Готово к подходу'}</div>
          <div class="hint">${round.total ? 'подход закончен' : 'выбери колоду и начни'}</div>
          <div class="counts">
            <span>выучено: ${s.learned}</span>
            <span>в колоде: ${s.total}</span>
            <span>к повторению: ${d}</span>
          </div>
        </div>
      </div>`;
    actions.innerHTML = `<div class="actions"><button class="btn wide" id="go">${d ? 'Начать подход' : 'Пройти ещё раз'}</button></div>`;
    document.getElementById('go').onclick = ()=>{ if(!dueCards().length){ state.mode='all'; } startRound(); };
  }
}

function reveal(){
  const c = document.getElementById('card');
  if(c) c.classList.add('open');
}
function esc(s){ return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

document.addEventListener('keydown', e=>{
  if(document.getElementById('sheet').classList.contains('on')) return;
  const open = document.querySelector('.card.open');
  if(e.code === 'Space'){ e.preventDefault(); open ? grade(true) : reveal(); }
  if(e.key === '1' && open) grade(false);
  if(e.key === '2' && open) grade(true);
  if(e.key === 'Enter' && !current) startRound();
});

// --- settings sheet -------------------------------------------------
const sheet = document.getElementById('sheet');
const catsEl = document.getElementById('cats');
function buildCats(){
  catsEl.innerHTML = CATS.map(c=>{
    const n = CARDS.filter(x=>x.c===c).length;
    return `<label class="chip"><input type="checkbox" value="${c}" ${state.sel.includes(c)?'checked':''}><span>${c}</span><span class="n">${n}</span></label>`;
  }).join('');
  catsEl.querySelectorAll('input').forEach(i=>i.onchange=()=>{
    state.sel = [...catsEl.querySelectorAll('input:checked')].map(x=>x.value);
    if(!state.sel.length){ i.checked = true; state.sel=[i.value]; }
    save(); render();
  });
}
function syncSegs(){
  document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('on', +b.dataset.size===state.size));
  document.querySelectorAll('[data-dir]').forEach(b=>b.classList.toggle('on', b.dataset.dir===state.dir));
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on', b.dataset.mode===state.mode));
}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{state.size=+b.dataset.size;save();syncSegs();});
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{state.dir=b.dataset.dir;save();syncSegs();render();});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();syncSegs();render();});
document.getElementById('openSettings').onclick = ()=>{ buildCats(); syncSegs(); sheet.classList.add('on'); };
sheet.onclick = e=>{ if(e.target===sheet) sheet.classList.remove('on'); };
document.getElementById('startBtn').onclick = ()=>{ sheet.classList.remove('on'); startRound(); };
document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('Удалить весь прогресс?')){ state.prog={}; state.session=0; save(); render(); }
};
document.getElementById('themeBtn').onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const nextT = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nextT);
  state.theme = nextT; save();
};

render();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
